"$schema" = 'https://starship.rs/config-schema.json'

format = """
$shell\
$username\
$hostname\
$directory\
$ruby\
$python\
$golang\
$terraform\
$kubernetes\
$gcloud\
$git_branch\
$git_commit\
$git_state\
$git_status\
$line_break\
$character
"""
command_timeout = 750

[shell]
disabled = false
bash_indicator = ' '
zsh_indicator = ''
format = '[$indicator]($style)'

[username]
style_user = 'bold green'
show_always = true
format = '[\[](bold)[$user]($style)[@](bold)'

[hostname]
ssh_symbol = " "
style = 'bold yellow'
ssh_only = false
format = '[$hostname$ssh_symbol]($style)[:](bold)'

[directory]
read_only = " 󰌾"
truncation_length = 8
truncation_symbol = '.../'
style = 'bold blue'
truncate_to_repo = false
before_repo_root_style = 'bold dimmed white'
repo_root_style = 'bold blue'
format = '[$path]($style)[$read_only]($read_only_style)[\]](bold) '
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)\] '

[ruby]
symbol = " "
format = '\[[$symbol$version]($style)\] '

[golang]
symbol = " "
format = '\[[$symbol$version]($style)\] '

[python]
symbol = " "
format = '\[[$symbol$version]($style)\] '

[terraform]
symbol = " "
format = '\[[$symbol$version]($style)\] '
command = [ [ 'tofu', 'version' ], [ 'terraform', 'version' ] ]

[perl]
symbol = " "

[nodejs]
symbol = " "

[gcloud]
symbol = " "
disabled = true

[kubernetes]
symbol = " "
disabled = false
style = 'cyan'
format = '\[[$symbol$context/$namespace]($style)\] '

[[kubernetes.contexts]]
context_pattern = ".*/api-(?P<ocpcluster>(sb|pp)[\\w-]+)-caas.*"
context_alias = '$ocpcluster'

[[kubernetes.contexts]]
style = "red"
context_pattern = ".*/api-(?P<ocpcluster>pd[\\w-]+)-caas.*"
context_alias = '$ocpcluster'

[git_branch]
symbol = " "
style = 'green'
format = '[\[](bold)[$symbol$branch(:$remote_branch)]($style)[\]](bold) '

[git_status]
style = ''
conflicted = '= '
ahead = '[⇡](blue) '
behind = '[⇣](red) '
diverged = '⇕ '
untracked = '[?](cyan) '
stashed = '[\$](blue) '
modified = '[!](yellow) '
staged = '[✚](green) '
renamed = '» '
deleted = '[✖](red) '
format = '([$all_status$ahead_behind]($style) )'

[character]
success_symbol = '%'
error_symbol = '[%](red)'
